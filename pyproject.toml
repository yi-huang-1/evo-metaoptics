[project]
name = "evo-metaoptics"
version = "0.1.0"
description = "Core reproducibility code for self-evolving metasurface inverse design"
readme = "README.md"
authors = [{ name = "yi-huang-1" }]
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0.2",
    "python-dotenv>=1.2.1",
    "refractiveindex>=0.0.7",
    "torchrdit>=0.1.28",
    "typing-extensions>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evo_metaoptics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".venv", "dist", "build"]

[dependency-groups]
dev = ["pytest>=9.0.2"]
